[package]
name = "s75-studio"
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/luisCoimbraDev/aula-s75-pro-linux"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
base64 = "0.22.1"
libc = "0.2.186"
gdk-pixbuf = "0.18.5"
gtk = "0.18.2"
png = "0.18.1"
s75-core = { path = "../crates/s75-core" }
